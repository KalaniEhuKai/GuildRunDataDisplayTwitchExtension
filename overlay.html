<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Local Game Data Bridge — Video Overlay</title>
  <link rel="stylesheet" href="style.css">
  <!-- Official Twitch Extension Helper SDK -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
</head>
<body>

  <!-- Floating Compact Pill Badge (Default unobtrusive widget on video overlay) -->
  <div class="overlay-widget">
    <div id="pill-btn" class="pill-badge" title="Click to view live run details">
      <div id="pill-status-dot" class="pill-dot offline"></div>
      <span id="pill-title-text" class="pill-text">Guild Run</span>
      <span id="pill-sub-text" class="pill-sub">Offline</span>
    </div>

    <!-- Full Expanded Overlay Drawer/Panel -->
    <div id="overlay-drawer" class="overlay-panel hidden">
      <div class="panel-header">
        <div class="panel-title">
          <span>🛡️ Live Guild Run</span>
        </div>
        <button id="close-drawer-btn" class="close-btn" title="Close overlay">&times;</button>
      </div>

      <div class="panel-content">

        <!-- Active Run State (populated dynamically) -->
        <div id="active-run-view">
          
          <!-- Run Stats Grid -->
          <div class="run-stats-grid">
            <div class="stat-box">
              <div class="stat-box-label">Act</div>
              <div class="stat-box-value" id="val-act">—</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">Floor</div>
              <div class="stat-box-value" id="val-floor">—</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">Shards</div>
              <div class="stat-box-value" id="val-gold">—</div>
            </div>
          </div>

          <!-- Relics Showcase -->
          <div style="margin-top: 14px;">
            <div class="section-title">
              <span>🔮 Active Relics (<span id="relics-count">0</span>)</span>
            </div>
            <div id="relics-list" class="relics-grid" style="margin-top: 8px;">
              <!-- Relic items auto-populated -->
            </div>
          </div>

          <!-- Party & Heroes Breakdown -->
          <div style="margin-top: 14px;">
            <div class="section-title">
              <span>⚔️ Party Heroes (<span id="party-count">0</span>)</span>
            </div>
            <div id="party-list" class="party-list" style="margin-top: 8px;">
              <!-- Hero cards auto-populated -->
            </div>
          </div>

          <!-- Seed / Info Subtext -->
          <div style="font-size: 0.7rem; color: var(--text-dim); text-align: center; margin-top: 12px;">
            Seed: <span id="val-seed" style="font-family: monospace; color: #fff;">—</span>
          </div>

        </div>

        <!-- No Active Run State (Shown when status is "no_file_found") -->
        <div id="no-run-view" class="no-run-card" hidden>
          <div class="no-run-icon">🛡️</div>
          <div class="no-run-title">No Active Run</div>
          <div class="no-run-desc">The streamer is not currently in an active Guild Run session.</div>
        </div>

      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
