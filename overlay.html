<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Local Game Data Bridge — Video Overlay</title>
  <link rel="stylesheet" href="style.css">
  <!-- Official Twitch Extension Helper SDK -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
</head>
<body>

  <div id="overlay-container" class="overlay-container">

    <!-- TOP-LEFT HOVER ZONE (Relics Information) -->
    <div id="zone-top-left" class="hover-zone zone-top-left">
      <div class="zone-box" id="box-top-left" title="Hover for Relics Info"></div>

      <!-- Top-Left Popover Panel -->
      <div id="panel-top-left" class="hover-popover popover-top-left hidden">
        <div class="popover-header">
          <span class="popover-title">🔮 Active Relics</span>
          <span id="relics-header-count" class="popover-subtitle">0 Relics</span>
        </div>
        <div class="popover-content">
          <div id="relics-list" class="relics-grid">
            <!-- Relic cards populated dynamically -->
          </div>
          <div id="relics-empty-view" class="empty-state" hidden>
            <div class="empty-icon">🔮</div>
            <div class="empty-title">No Relics Acquired</div>
            <div class="empty-desc">The streamer has not collected any relics in this run yet.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- MIDDLE-RIGHT HOVER ZONE (Current Challenge Data) -->
    <div id="zone-middle-right" class="hover-zone zone-middle-right">
      <div class="zone-box" id="box-middle-right" title="Hover for Challenge Info"></div>

      <!-- Middle-Right Popover Panel -->
      <div id="panel-middle-right" class="hover-popover popover-middle-right hidden">
        <div class="popover-header">
          <span class="popover-title">⚔️ Current Challenge</span>
        </div>
        <div class="popover-content">
          
          <!-- Active Run View -->
          <div id="active-challenge-view">
            <!-- Stats Grid -->
            <div class="run-stats-grid">
              <div class="stat-box">
                <div class="stat-box-label">Act</div>
                <div class="stat-box-value" id="val-act">—</div>
              </div>
              <div class="stat-box">
                <div class="stat-box-label">Floor</div>
                <div class="stat-box-value" id="val-floor">—</div>
              </div>
              <div class="stat-box">
                <div class="stat-box-label">Hero Deaths</div>
                <div class="stat-box-value" id="val-deaths">0</div>
              </div>
            </div>
          </div>

          <!-- Empty / Offline State -->
          <div id="no-challenge-view" class="empty-state" hidden>
            <div class="empty-icon">🛡️</div>
            <div class="empty-title">No Active Challenge</div>
            <div class="empty-desc">The streamer is not currently in an active Guild Run challenge session.</div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script src="guildrundatabase.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
