<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Local Game Data Bridge — Extension Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Official Twitch Extension Helper SDK -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1.5rem;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; }
    p { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1rem; }
    .btn {
      background: #9146ff;
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #772ce8; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 1rem;
    }
    .status-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .status-err { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛡️ Twitch Local Game Data Bridge Overlay</h1>
    <p>This extension automatically connects your Twitch channel to your local game data bridge. No manual setup required!</p>
    <p>Ensure your streamer dashboard is running at <strong><a href="https://tlgdb-dashboard.kalani-ehu-kai.workers.dev" target="_blank" style="color: #38bdf8;">tlgdb-dashboard.kalani-ehu-kai.workers.dev</a></strong>.</p>

    <button id="test-btn" class="btn">🧪 Test Bridge Connection</button>

    <div id="test-status" hidden></div>
  </div>

  <script src="config.js"></script>
</body>
</html>
